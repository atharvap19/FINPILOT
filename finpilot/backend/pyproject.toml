[project]
name = "finpilot-backend"
version = "0.1.0"
description = "FinPilot ingestion pipeline - turns statements, bills, receipts, emails and sheets into one clean ledger"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # API
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "python-multipart>=0.0.12",
    # persistence
    "SQLAlchemy>=2.0.36",
    # tabular / documents
    "pandas>=2.2",
    "openpyxl>=3.1",
    "pdfplumber>=0.11",
    "pikepdf>=9.4",
    "html2text>=2024.2.26",
    "Pillow>=11.0",
    # validation
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "pandera>=0.21",
    # matching / dates
    "rapidfuzz>=3.10",
    "python-dateutil>=2.9",
    # llm
    "google-genai>=1.0",
    "python-dotenv>=1.0",
    "scikit-learn>=1.3",
    "chromadb>=1.0",
    "reportlab>=4.2",
]

[project.optional-dependencies]
# libmagic bindings. On Windows libmagic.dll is usually absent, so detect.py
# always keeps its own signature sniffer as the fallback.
magic = ["python-magic>=0.4.27; sys_platform != 'win32'"]
# Heavy (pulls torch). Only needed for embedding-based header mapping and
# merchant resolution; both degrade gracefully when this is not installed.
embeddings = ["sentence-transformers>=3.3"]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "Faker>=33.0",
    "httpx>=0.28",
    "reportlab>=4.2",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app", "ingestion"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "live_llm: hits the real Gemini API; skipped unless FINPILOT_LIVE_LLM=1",
]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "B008"]
